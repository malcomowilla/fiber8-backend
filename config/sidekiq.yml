default:
  :concurrency: 3
  :queues:
    - [invoices, 2]
    - [client_conf, 2]
    - [default, 2]
    - [radacct, 1]
development:
  :concurrency: 2
  :queues:
    - [invoices, 2]
    - [client_conf, 1]
    - [default, 1]
    - [radacct, 1]
:scheduler:
  :enabled: true
  :dynamic: false
  :schedule:
    generate_invoice_job:
      class: GenerateInvoiceJob
      cron: "*/6 * * * *"
    rehydrate_wireguard_job:
      class: RehydrateWireguardJob
      cron: "*/2 * * * *"
    pay_partners_job:
      class: PayPartnersJob
      cron: "*/5 * * * *"
    expire_ip_bindings_job:
      class: ExpireIpBindingsJob
      cron: "*/5 * * * *"
    pay_isps_job:
      class: PayIspsJob
      cron: "*/5 * * * *"
    subscription_expiration_notification_job:
        class: SubscriptionExpirationNotificationJob
        cron: "*/5 * * * *"


   
    subscription_expiry_reminder_job:
        class: SubscriptionExpiryReminderJob
        cron: "*/4 * * * *"
    rad_sessions_job:
      class: RadSessionsJob
      cron: "*/1 * * * *"
      # every: ["20s"]
      # queue: radacct
    # generate_clients_conf_job:
    #   class: GenerateClientsConfJob
    #   cron: "*/5 * * * *"
    access_point_ping_job:
      class: AccessPointPingJob
      cron: "*/5 * * * *"
    access_point_notifications_job:
      class: AccessPointNotificationsJob
      cron: "*/5 * * * *"


    populate_radius_job:
      class: PopulateRadiusJob
      cron: "*/4 * * * *"
    delete_session_job:
      class: DeleteSessionJob
      cron: "*/10 * * * *"
    online_stats_broadcast_job:
      class: OnlineStatsBroadcastJob
      cron: "*/2 * * * *"
    router_notification_job:
      class: RouterNotificationJob
      cron: "*/2 * * * *"
    hotspot_compensation_job:
      class: HotspotCompensationJob
      cron: "*/5 * * * *"

    lock_account_job:
      class: LockAccountJob
      cron: "*/4 * * * *"
    hotspot_expiration_job:
      class: HotspotExpirationJob
      cron: "*/3 * * * *"
    voucher_sync_job:
      class: VoucherSyncJob
      cron: "*/2 * * * *"
    contention_ratio_job:
      class: ContentionRatioJob
      cron: "*/4 * * * *"

    router_ping_job:
      class: RouterPingJob
      cron: "*/4 * * * *"
    subscription_expiration_job:
      class: SubscriptionExpirationJob
      cron: "*/5 * * * *"

    inactivity_check_job:
      class: InactivityCheckJob
      cron: "*/5 * * * *"
production:
  # Raised from the inherited default of 2 — with ~20 cron jobs firing every
  # 1-10 minutes plus on-demand jobs like imports, 2 threads on this box was
  # catastrophically oversubscribed (confirmed: both threads were
  # permanently occupied by overlapping HotspotExpirationJob runs, starving
  # everything else including ImportSubscribersJob). 5 is a safe increase
  # for a 2-core box doing mostly I/O-bound work (DB + HTTP to routers) —
  # make sure config/database.yml's connection pool is at least this size
  # (see note below).
  :concurrency: 5
  :queues:
    # New top-priority queue for user-triggered, latency-sensitive jobs
    # (imports, etc.) so they never sit behind the cron backlog again.
    - [invoices, 2]
    - [client_conf, 2]
    - [default, 1]
    - [radacct, 1]