default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500

  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  dispatchers:
    - polling_interval: 1
      batch_size: 500

  workers:
    - queues: priority
      threads: 2
      processes: 1
      polling_interval: 0.1

    - queues: default,client_conf,invoices,radacct
      threads: 3
      processes: 1
      polling_interval: 1

test:
  <<: *default

production:
  <<: *default